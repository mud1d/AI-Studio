<!doctype html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c1020"><title>AI Studio</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f4f5ff;background:#0b1020}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:22px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:28px;margin:0}.pill{border:1px solid #42476a;border-radius:99px;padding:7px 12px;font-size:12px;color:#b9c3ed}.panel{background:#171d33;border:1px solid #303956;border-radius:22px;padding:20px;margin:18px 0}h2{font-size:19px;margin:0 0 15px}.muted{color:#aab4d1;font-size:14px;line-height:1.6}label{display:block;font-size:13px;margin:15px 0 7px;color:#c7d1ed}textarea,select,input{width:100%;background:#0e1427;border:1px solid #39425f;border-radius:12px;color:white;padding:13px;font:inherit}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button.active{background:#6256f4;color:white;border-color:#6256f4}button{border:1px solid #424c6c;border-radius:12px;background:#222b48;color:white;padding:13px;font:inherit;cursor:pointer}button.primary{background:linear-gradient(110deg,#7664ff,#b14dff);border:0;width:100%;font-weight:700;margin-top:18px}button:disabled{opacity:.55;cursor:not-allowed}.preview{border:2px dashed #414a6b;border-radius:18px;min-height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;overflow:hidden}.preview img{max-width:100%;max-height:350px;border-radius:12px}.hidden{display:none}small{color:#9da9ce}footer{text-align:center;color:#8f9abb;font-size:12px;margin-top:25px}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><h1>✦ AI Studio</h1><span class="pill">Mobile beta</span></header><p class="muted">Xayoliy personajlar uchun rasm yaratish va tahrirlash studiyasi.</p><section class="panel"><div class="tabs"><button id="newTab" class="active" type="button">✨ Yangi rasm</button><button id="editTab" type="button">🖼️ Tahrirlash</button></div><div id="uploadArea" class="hidden"><label for="photo">Rasm tanlang</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></div><label for="prompt">Tasvirni ta'riflang</label><textarea id="prompt" placeholder="Masalan: 25 yoshli xayoliy yapon personaji, pushti gulli kiyim, yorug‘ yotoqxona, fotorealistik uslub..."></textarea><div class="grid"><div><label for="pose">Poza</label><select id="pose"><option value="">Erkin</option><option>O‘tirgan</option><option>Yonboshlab yotgan</option><option>Chalqancha yotgan</option><option>Tik turgan</option></select></div><div><label for="angle">Kamera rakursi</label><select id="angle"><option value="">Erkin</option><option>Old tomondan</option><option>Yon tomondan</option><option>Tepadan</option><option>Orqadan</option></select></div><div><label for="style">Uslub</label><select id="style"><option>Fotorealistik</option><option>Anime</option><option>3D</option><option>Illustratsiya</option></select></div><div><label for="ratio">Format</label><select id="ratio"><option>1:1</option><option>3:4</option><option>9:16</option><option>16:9</option></select></div></div><button id="generate" class="primary" type="button">✦ Rasm yaratish</button><p id="status" class="muted" role="status">Hozircha interfeys tayyor. AI server hali ulanmagan.</p></section><section class="panel"><h2>Natija</h2><div id="preview" class="preview"><span style="font-size:36px">🎨</span><p class="muted">Rasm shu yerda ko‘rinadi</p></div></section><footer>AI Studio • Prototype v0.1 • No image API connected</footer></main><script>
const newTab=document.querySelector('#newTab'),editTab=document.querySelector('#editTab'),uploadArea=document.querySelector('#uploadArea'),photo=document.querySelector('#photo'),preview=document.querySelector('#preview');let mode='new';function tab(value){mode=value;newTab.classList.toggle('active',mode==='new');editTab.classList.toggle('active',mode==='edit');uploadArea.classList.toggle('hidden',mode==='new')}newTab.onclick=()=>tab('new');editTab.onclick=()=>tab('edit');photo.onchange=()=>{const file=photo.files[0];if(!file)return;if(!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=document.createElement('img');img.src=reader.result;img.alt='Yuklangan rasm';preview.replaceChildren(img)};reader.readAsDataURL(file)};document.querySelector('#generate').onclick=()=>{const prompt=document.querySelector('#prompt').value.trim();const status=document.querySelector('#status');if(!prompt){status.textContent='Avval tasvir tavsifini yozing.';return}if(mode==='edit'&&!photo.files.length){status.textContent='Tahrirlash uchun rasm yuklang.';return}status.textContent='So‘rov tayyor. Haqiqiy generatsiya uchun AI serverini ulash kerak. Hozir rasm yaratilmaydi.'};
</script></body></html>
